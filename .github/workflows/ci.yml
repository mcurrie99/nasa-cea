name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            gfortran \
            libclang-dev

      - name: Install Rust components
        run: rustup component add clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cmake --version
          gfortran --version
          clang --version

      - name: Lint
        run: |
          cargo clippy -p cea-sys --all-targets -- -D warnings
          cargo clippy -p cea --all-targets -- -D warnings
          cargo clippy -p nasa-cea --lib --examples -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Run example smoke test
        run: cargo run -p nasa-cea --example tp_equilibrium

      - name: Build docs
        run: cargo doc --workspace --no-deps
